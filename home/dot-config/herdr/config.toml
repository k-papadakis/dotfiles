onboarding = false

[keys]
prefix = "ctrl+a"
switch_workspace = "cmd+1..9"
focus_agent = "ctrl+1..9"
last_pane = ["prefix+a", "cmd+a"]
focus_pane_left = ["prefix+h", "cmd+h"]
focus_pane_down = ["prefix+j", "cmd+j"]
focus_pane_up = ["prefix+k", "cmd+k"]
focus_pane_right = ["prefix+l", "cmd+l"]

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "local.close-guard.close-pane"
description = "Close pane (confirm unless idle shell)"

[[keys.command]]
key = "prefix+shift+x"
type = "plugin_action"
command = "local.close-guard.close-tab"
description = "Close tab (confirm unless idle shells)"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "local.close-guard.close-workspace"
description = "Close workspace (confirm unless idle shells)"

[theme]
name = "kanagawa"
auto_switch = false

[ui]
right_click_passthrough_modifier = "cmd"
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
