onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[ui]
right_click_passthrough_modifier = "cmd"
prompt_new_workspace_name = true
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+v", "prefix+|"]
switch_workspace = "cmd+1..9"
focus_agent = "ctrl+1..9"
last_pane = ["prefix+a", "cmd+a"]
focus_pane_left = ["prefix+h", "cmd+h"]
focus_pane_down = ["prefix+j", "cmd+j"]
focus_pane_up = ["prefix+k", "cmd+k"]
focus_pane_right = ["prefix+l", "cmd+l"]

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "local.close-guard.close-pane"
description = "Close pane (confirm unless idle shell)"

[[keys.command]]
key = "prefix+shift+x"
type = "plugin_action"
command = "local.close-guard.close-tab"
description = "Close tab (confirm unless idle shells)"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "local.close-guard.close-workspace"
description = "Close workspace (confirm unless idle shells)"

[[keys.command]]
key = "prefix+`"
type = "popup"
description = "Join pane into another tab or workspace"
command = '''
dest=$(
  jq -rn --argjson ws "$(herdr workspace list)" --argjson tabs "$(herdr tab list)" '
    ($ws.result.workspaces | map({(.workspace_id): .label}) | add) as $names
    | (
        $tabs.result.tabs[]
        | select(.tab_id != env.HERDR_ACTIVE_TAB_ID)
        | "tab\t\(.tab_id)\t\($names[.workspace_id]) / \(.label)"
      ),
      (
        $ws.result.workspaces[]
        | "workspace\t\(.workspace_id)\t\(.label) / + new tab"
      )' |
    fzf --with-nth=3.. --delimiter='\t' --prompt='join> ' | head -n1 | cut -f1,2
)
[ -n "$dest" ] || exit 0
kind=$(printf '%s' "$dest" | cut -f1)
id=$(printf '%s' "$dest" | cut -f2)
case $kind in
  tab) herdr pane move "$HERDR_ACTIVE_PANE_ID" --tab "$id" --split right --focus ;;
  workspace) herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --workspace "$id" --focus ;;
esac
'''

[[keys.command]]
key = "prefix+!"
type = "popup"
description = "Break pane into a new tab"
command = '''
printf 'tab name> ' && read -r name &&
  herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab ${name:+--label "$name"} --focus
'''
