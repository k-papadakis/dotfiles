# KDE Plasma: use ksshaskpass for SSH/GUI passphrase prompts.
# With "Remember password" checked, passphrases are stored in KWallet.
#
# Setup:
#   1. sudo pacman -S openssh kwallet ksshaskpass kwallet-pam kwalletmanager
#   2. KWallet must be named "kdewallet", Blowfish encryption, same password as login.
#      /etc/pam.d/sddm already unlocks it via pam_kwallet5.so (kwallet-pam).
#   3. Relogin so this environment.d file takes effect.
#   4. First `ssh` prompts via GUI -> check "Remember password" -> stored in KWallet.
#
# Docs: https://wiki.archlinux.org/title/KDE_Wallet#Using_the_KDE_Wallet_to_store_ssh_key_passphrases
# See also: https://wiki.archlinux.org/title/SSH_keys
SSH_ASKPASS=/usr/bin/ksshaskpass
# Prefer SSH_ASKPASS over TTY prompt so GUI/KWallet integration is used.
SSH_ASKPASS_REQUIRE=prefer
