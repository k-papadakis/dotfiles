# ksshaskpass for GUI passphrase prompts. Wallet must be "kdewallet" with
# Blowfish encryption and your login password (unlocked at SDDM login);
# tick "Remember password" once and the passphrase lives there. Relogin to apply.
#
# Docs: https://wiki.archlinux.org/title/KDE_Wallet#Using_the_KDE_Wallet_to_store_ssh_key_passphrases
# See also: https://wiki.archlinux.org/title/SSH_keys
SSH_ASKPASS=/usr/bin/ksshaskpass
# Prefer SSH_ASKPASS over TTY prompt so GUI/KWallet integration is used.
SSH_ASKPASS_REQUIRE=prefer
