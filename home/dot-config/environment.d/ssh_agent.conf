# OpenSSH agent socket (systemd user unit, socket-activated).
# Covers the user manager and its descendants; sshd sessions fall back via
# dot-zshenv. Enable once with `systemctl --user enable --now ssh-agent.socket`,
# relogin to apply, verify with `ssh-add -l`.
#
# Docs: https://wiki.archlinux.org/title/SSH_keys#Start_ssh-agent_with_systemd_user
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
