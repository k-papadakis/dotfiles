# OpenSSH agent socket (socket-activated systemd user unit).
# Lets ssh/git find ssh-agent in every session.
#
# Setup:
#   1. systemctl --user enable --now ssh-agent.socket
#   2. Relogin so this environment.d file takes effect.
#   3. Verify with `echo $SSH_AUTH_SOCK` and `ssh-add -l`.
#
# Note: when forwarding (ssh -A), remote sshd sets SSH_AUTH_SOCK itself.
# Do not override it there; for shells use:
#   [[ -z "$SSH_CONNECTION" ]] && export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
#
# Docs: https://wiki.archlinux.org/title/SSH_keys#Start_ssh-agent_with_systemd_user
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
